services:
  mongodb:
    image: mongo:latest
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_DATABASE: devops-db
    volumes:
      - mongo-data:/app/db
    networks:
      - devops-network
  
  backend:
    image: kashifhm333/devops-project-backend:v1
    ports:
      - 5000:5000
    environment:
      PORT: 5000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongodb:27017/devops-db
    depends_on:
      - mongodb
    networks:
      - devops-network
  
  frontend:
    image: kashifhm333/devops-project-frontend:v1
    ports:
      - 5173:5173
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - devops-network

volumes:
  mongo-data:
    driver: local
networks:
  devops-network:
    driver: bridge