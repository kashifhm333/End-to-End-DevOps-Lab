apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: devops-project
  labels:
    app: mongodb
spec:
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb-port
  clusterIP: None
  selector:
    app: mongodb
  
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: devops-project
  labels:
    app: mongodb
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      name: mongodb-service
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb-containers
          image: mongo:latest
          ports:
            - containerPort: 27017
              name: mongo
          env:
            - name: MONGO_INITDB_DATABASE
              value: devops-db
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
        
