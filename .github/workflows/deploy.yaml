name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    name: run tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v4.4.0
      
      - name: set the node.js
        uses: actions/setup-node@v7.1.0

      - name: install the dependences
        run: npm install
      - name: run the tests
        run: npm test
         
    
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: checkout repo code
        uses: actions/checkout@v4.4.0
      

      - name: set docker buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: login to docker
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: build and push backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops_end_to_end_project-backend:latest
      
      - name: build and push frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops_end_to_end_project-frontend:latest
          
    
          
          
        

        
